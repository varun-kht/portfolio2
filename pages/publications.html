<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>publications · varun khatri</title>
  <script type="module" src="/theme.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f0ff;
      --card: #ede8ff;
      --border: #d4c8f0;
      --border-soft: #e0d8f8;
      --ink: #2a1f4a;
      --ink-soft: #3e2f6e;
      --muted: #7a6a9a;

      --rose: #b39ddb;
      --rose-deep: #9575cd;
      --rose-dark: rgb(103, 58, 183);
      --peach: #ce93d8;
      --gold: #ab86d4;
      --sage: #80cbc4;
      --sky: #81d4fa;
      --lilac: #b39ddb;
      --forest-green: #1a6a5a;

      --shadow: 2px 2px 0 rgba(60, 30, 140, 0.10);
      --shadow-lg: 3px 3px 0 rgba(60, 30, 140, 0.12);
    }

    [data-theme="dark"] {
      --bg: #13102a;
      --card: #1a1640;
      --border: #2e2550;
      --border-soft: #261e44;
      --ink: #e8e4f4;
      --ink-soft: #c4b8e8;
      --muted: #8878b0;
      --rose: #b39ddb;
      --rose-deep: #9575cd;
      --rose-dark: rgb(149, 117, 205);
      --shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-lg: 3px 3px 0 rgba(0, 0, 0, 0.35);
      --peach: #ce93d8;
      --gold: #ab86d4;
      --sage: #80cbc4;
      --sky: #81d4fa;
      --lilac: #b39ddb;
      --forest-green: #4db6ac;
    }

    [data-theme="dark"] .socials img {
      filter: invert(0.85);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      transition: color 0.15s, border-color 0.15s;
      line-height: 1;
    }

    .theme-toggle:hover {
      color: var(--ink);
      border-color: var(--ink-soft);
    }

    .toggle-icon::before {
      content: '\263E';
    }

    [data-theme="dark"] .toggle-icon::before {
      content: '\2600';
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--rose-deep);
      text-decoration: none;
    }

    a:hover {
      color: var(--ink);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 36px 30px 90px;
    }

    /* shared nav */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 0px solid var(--border);
      margin-bottom: 48px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo img {
      width: 44px;
      height: 44px;
    }

    .nav-logo a {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 28px;
      color: var(--rose-dark);
      letter-spacing: 0.005em;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 17px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-links a:hover {
      color: var(--ink);
    }

    .nav-links a.on {
      color: var(--ink);
    }

    /* page head */
    .head-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 8px;
    }

    .page-title {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 50px;
      line-height: 1;
      color: var(--ink);
      margin: 0;
    }

    .head-kao {
      color: var(--rose-deep);
      font-size: 16px;
      margin-bottom: 6px;
    }

    .intro {
      color: var(--ink-soft);
      font-size: 16px;
      max-width: 560px;
      margin: 6px 0 40px;
    }

    /* publication list */
    .pub-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pub {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      opacity: 0;
      transform: translateY(16px);
      animation: pubIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .pub:nth-child(1) { animation-delay: 0.05s; }
    .pub:nth-child(2) { animation-delay: 0.15s; }
    .pub:nth-child(3) { animation-delay: 0.25s; }
    .pub:nth-child(4) { animation-delay: 0.35s; }
    .pub:nth-child(5) { animation-delay: 0.45s; }

    @keyframes pubIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pub:hover {
      transform: translateY(-4px);
      box-shadow: 4px 6px 0 rgba(103, 58, 140, 0.16);
      border-color: var(--rose-deep);
    }

    @media (prefers-reduced-motion: reduce) {
      .pub {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    .pub-title {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 24px;
      line-height: 1.2;
      margin: 0 0 6px;
    }

    .pub:nth-child(7n+1) .pub-title { color: var(--rose-deep); }
    .pub:nth-child(7n+2) .pub-title { color: var(--peach); }
    .pub:nth-child(7n+3) .pub-title { color: var(--gold); }
    .pub:nth-child(7n+4) .pub-title { color: var(--sage); }
    .pub:nth-child(7n+5) .pub-title { color: var(--sky); }
    .pub:nth-child(7n+6) .pub-title { color: var(--lilac); }
    .pub:nth-child(7n) .pub-title { color: var(--rose-deep); }

    .pub-authors {
      color: var(--ink-soft);
      font-size: 14px;
      margin: 0 0 4px;
    }

    .pub-authors .me {
      color: var(--ink);
      font-weight: 600;
    }

    .pub-venue {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: var(--rose-deep);
      letter-spacing: 0.02em;
      margin: 0 0 10px;
    }

    .pub-venue .year {
      color: var(--muted);
    }

    .pub-desc {
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.55;
      margin: 0 0 12px;
    }

    .pub-links {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .pub-links a {
      color: var(--forest-green);
      font-weight: 600;
    }

    .pub-links a:hover {
      color: var(--ink);
    }

    .empty {
      color: var(--muted);
      font-size: 15px;
      font-style: italic;
    }

    /* foot */
    .foot {
      margin-top: 72px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 12px;
    }

    .socials img {
      width: 20px;
      height: 20px;
      opacity: 0.6;
    }

    .socials a:hover img {
      opacity: 1;
    }

    .copy {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      .page-title {
        font-size: 40px;
      }
    }
  </style>
</head>

      <div class="nav-links">

        <button class="theme-toggle" aria-label="Toggle dark mode">
          <span class="toggle-icon"></span>

    </div>
    <p class="intro">peer-reviewed papers, preprints &amp; research write-ups.</p>

    <div class="pub-list">

      <p class="empty">Coming soon — papers &amp; research write-ups are on the way. ✦</p>

    </div>

      </div>
      <div class="copy">&copy; varun khatri</div>
    </footer>

  </div>
  <script type="module" src="/companion.js"></script>
</body>

</html>
